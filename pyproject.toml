[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldtwin-agents"
version = "0.1.0"
description = "Person B: Nemotron crop agents and dev evaluation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
fieldtwin = "fieldtwin_agents.cli:main"

[tool.setuptools.packages.find]
include = ["fieldtwin_agents*"]

[tool.setuptools.package-data]
fieldtwin_agents = ["prompts/*/*.txt"]
