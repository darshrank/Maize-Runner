<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldTwin Replay</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Top bar: pickers and playback controls -->
  <header id="topbar">
    <div class="brand"><span class="logo">■</span> FieldTwin</div>
    <label>Task <select id="task-picker"></select></label>
    <label>Left <select id="left-picker"></select><span class="fake-badge" id="left-fake" hidden>FAKE</span></label>
    <label>Right <select id="right-picker"></select><span class="fake-badge" id="right-fake" hidden>FAKE</span></label>
    <button id="play-btn" title="Play / pause">▶</button>
    <label class="slider">Week <input id="week-slider" type="range" min="0" max="20" step="1" value="0">
      <span id="week-label">0</span></label>
    <label>Speed <select id="speed-picker">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select></label>
  </header>

  <main id="layout">
    <!-- Two fields, same season -->
    <section id="fields">
      <div class="field-panel" id="field-left" data-side="left">
        <div class="field-title"><span class="side">LEFT</span> <span class="config-name"></span></div>
        <div class="field-canvas"></div>
        <div class="counters"></div>
      </div>
      <div class="field-panel" id="field-right" data-side="right">
        <div class="field-title"><span class="side">RIGHT</span> <span class="config-name"></span></div>
        <div class="field-canvas"></div>
        <div class="counters"></div>
      </div>
    </section>

    <!-- Agent log for the selected field and current week -->
    <aside id="log-panel">
      <div class="log-header">Agent log · <span id="log-title"></span></div>
      <!-- One block per agent for the current week (line-level week) -->
      <div id="agents-panel"></div>
      <div class="log-subheader">Raw events</div>
      <div id="log"></div>
    </aside>
  </main>

  <!-- Rain per week; storms highlighted. Click a bar to jump to that week. -->
  <footer id="weather-strip"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
