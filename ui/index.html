<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldTwin</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonts are vendored (ui/vendor/README.md): replay makes no CDN calls. -->
</head>
<body class="not-loaded">
  <!-- One shared glow filter for every SVG on the page: small blur merged under the stroke. ?lite=1 drops it. -->
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-60" width="720" height="600" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </svg>

  <header id="bar">
    <div class="brand"><i class="mark"></i><span>FieldTwin</span></div>
    <nav id="tabs">
      <button data-view="season" class="on"><span class="key">1</span>Season</button>
      <button data-view="results"><span class="key">2</span>Results</button>
      <button data-view="improve"><span class="key">3</span>Improve</button>
      <button data-view="serving"><span class="key">4</span>Serving</button>
      <button data-view="how"><span class="key">5</span>How it works</button>
    </nav>
    <label class="pick"><span class="label">Season</span><select id="task" aria-label="Season"></select></label>
    <span id="fake" class="badge fake" hidden title="FAKE data from ui/fake/ (UI testing only)">FAKE</span>
    <div class="grow"></div>
    <div id="chips"></div>
  </header>

  <main id="season" class="view">
    <div id="week" aria-live="polite">
      <span id="week-num" class="mono">Week 0</span><span id="week-of" class="mono quiet"></span><span id="week-date" class="quiet"></span>
    </div>

    <div id="fields">
      <section class="field" id="field-left">
        <header class="field-head">
          <h2 id="name-left">Farmer calendar</h2>
          <span id="src-left" class="badge" hidden></span>
          <span id="fb-left" class="badge fallback" hidden></span>
        </header>
        <div class="plot" id="plot-left"></div>
        <div class="tally" id="tally-left">
          <div class="live"><span class="label">N leached</span><span class="v mono leach">n/a</span><span class="unit">kg/ha</span></div>
          <div class="end" id="end-left" hidden>
            <span class="label">Profit</span><span class="v mono profit">n/a</span><span class="unit">$/ha</span>
            <span class="label">Grain</span><span class="v mono grain">n/a</span><span class="unit">kg/ha</span>
          </div>
        </div>
        <div class="lines">
          <div class="objection" id="obj-left" hidden><span class="who">Critic</span><span class="t"></span></div>
          <div class="why" id="why-left"><span class="who"></span><span class="t"></span><span class="flag" hidden>fallback</span></div>
        </div>
      </section>

      <section class="field" id="field-right">
        <header class="field-head">
          <h2 id="name-right">FieldTwin agent team</h2>
          <span id="src-right" class="badge" hidden></span>
          <span id="fb-right" class="badge fallback" hidden></span>
        </header>
        <div class="plot" id="plot-right"></div>
        <div class="tally" id="tally-right">
          <div class="live"><span class="label">N leached</span><span class="v mono leach">n/a</span><span class="unit">kg/ha</span></div>
          <div class="end" id="end-right" hidden>
            <span class="label">Profit</span><span class="v mono profit">n/a</span><span class="unit">$/ha</span>
            <span class="label">Grain</span><span class="v mono grain">n/a</span><span class="unit">kg/ha</span>
          </div>
        </div>
        <div class="lines">
          <div class="objection" id="obj-right" hidden><span class="who">Critic</span><span class="t"></span></div>
          <div class="why" id="why-right"><span class="who"></span><span class="t"></span><span class="flag" hidden>fallback</span></div>
        </div>
      </section>
    </div>

    <section id="bottom">
      <div id="controls">
        <button id="play" class="btn" aria-label="Play">Play</button>
        <button id="prev" class="btn" aria-label="Previous week">&lsaquo;</button>
        <button id="next" class="btn" aria-label="Next week">&rsaquo;</button>
        <div class="seg speed" role="group" aria-label="Speed">
          <button data-speed="0.5">0.5x</button><button data-speed="1" class="on">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button>
        </div>
        <button id="reset" class="btn" aria-label="Reset to week 0">Reset</button>
        <button id="chat-toggle" class="btn" aria-label="Agent chat">Agent chat <span class="key">A</span></button>
        <span class="keys quiet">Space play · arrows step · R reset</span>
      </div>
      <svg id="timeline" role="img" aria-label="Season timeline: daily rain and week scrubber"></svg>
    </section>

    <aside id="chat" hidden>
      <div class="chat-bar"><span class="label">Agent chat, this week</span><button id="chat-close" class="btn" aria-label="Close agent chat">Close</button></div>
      <div id="chat-body"></div>
    </aside>
  </main>

  <main id="placeholder" class="view" hidden>
    <div class="placeholder"><span class="label" id="placeholder-title"></span><span class="quiet" id="placeholder-text"></span></div>
  </main>

  <div id="notice" class="quiet" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
